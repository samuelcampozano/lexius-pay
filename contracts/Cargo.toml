[package]
name = "lexius-pay-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
keywords = ["arbitrum", "stylus", "escrow", "ai-oracle", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stylus-sdk = "0.10.8"
alloy-primitives = "1.6.1"
alloy-sol-types = "1.6.1"

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[workspace]
