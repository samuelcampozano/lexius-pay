name: 🚀 Lexius Pay — CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  PROJECT_ID: lexius-pay-2026
  REGION: us-central1
  CONTRACT_ADDRESS: "0xc03bfde0441130dbce84128500b77d3edd5c8e33"

# ─────────────────────────────────────────────
# Resolve environment & service targets
# ─────────────────────────────────────────────
jobs:
  setup:
    name: 🔧 Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment:       ${{ steps.vars.outputs.environment }}
      oracle_service:    ${{ steps.vars.outputs.oracle_service }}
      frontend_service:  ${{ steps.vars.outputs.frontend_service }}
      oracle_url:        ${{ steps.vars.outputs.oracle_url }}
      frontend_url:      ${{ steps.vars.outputs.frontend_url }}
      bot_username:      ${{ steps.vars.outputs.bot_username }}
    steps:
      - id: vars
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production"                                                        >> $GITHUB_OUTPUT
            echo "oracle_service=lexius-ai-oracle"                                              >> $GITHUB_OUTPUT
            echo "frontend_service=lexius-frontend"                                             >> $GITHUB_OUTPUT
            echo "oracle_url=https://lexius-ai-oracle-265650435557.us-central1.run.app"        >> $GITHUB_OUTPUT
            echo "frontend_url=https://lexius-frontend-265650435557.us-central1.run.app"       >> $GITHUB_OUTPUT
            echo "bot_username=LexiusPayBot"                                                    >> $GITHUB_OUTPUT
          else
            echo "environment=staging"                                                          >> $GITHUB_OUTPUT
            echo "oracle_service=lexius-ai-oracle-staging"                                     >> $GITHUB_OUTPUT
            echo "frontend_service=lexius-frontend-staging"                                    >> $GITHUB_OUTPUT
            echo "oracle_url=https://lexius-ai-oracle-staging-265650435557.us-central1.run.app" >> $GITHUB_OUTPUT
            echo "frontend_url=https://lexius-frontend-staging-265650435557.us-central1.run.app" >> $GITHUB_OUTPUT
            echo "bot_username=LexiusPayTestBot"                                                >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # Build & Deploy AI Oracle
  # ─────────────────────────────────────────────
  deploy-oracle:
    name: 🤖 Deploy AI Oracle → ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify GCP_SA_KEY secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ ERROR: secrets.GCP_SA_KEY is missing!"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Push AI Oracle Image (with GHA caching)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-oracle
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ needs.setup.outputs.oracle_service }}:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ needs.setup.outputs.oracle_service }}:${{ github.sha }}
          cache-from: type=gha,scope=oracle-${{ needs.setup.outputs.environment }}
          cache-to: type=gha,mode=max,scope=oracle-${{ needs.setup.outputs.environment }}

      - name: Deploy AI Oracle Image to Cloud Run
        run: |
          gcloud run deploy ${{ needs.setup.outputs.oracle_service }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ needs.setup.outputs.oracle_service }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-secrets="ORACLE_PRIVATE_KEY=ORACLE_PRIVATE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,STYLUS_RPC_URL=STYLUS_RPC_URL:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest" \
            --set-env-vars="STYLUS_CONTRACT_ADDRESS=${{ env.CONTRACT_ADDRESS }},NODE_ENV=${{ needs.setup.outputs.environment }},TELEGRAM_BOT_USERNAME=${{ needs.setup.outputs.bot_username }},TELEGRAM_WEBHOOK_URL=${{ needs.setup.outputs.oracle_url }},FRONTEND_URL=${{ needs.setup.outputs.frontend_url }}" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --port=8080 \
            --project=${{ env.PROJECT_ID }}

  # ─────────────────────────────────────────────
  # Build & Deploy Frontend
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend → ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, deploy-oracle]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify GCP_SA_KEY secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ ERROR: secrets.GCP_SA_KEY is missing!"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Push Frontend Image (with GHA caching)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_STYLUS_CONTRACT_ADDRESS=${{ env.CONTRACT_ADDRESS }}
            NEXT_PUBLIC_STYLUS_RPC_URL=https://sepolia-rollup.arbitrum.io/rpc
            NEXT_PUBLIC_AI_ORACLE_URL=${{ needs.setup.outputs.oracle_url }}
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ needs.setup.outputs.frontend_service }}:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ needs.setup.outputs.frontend_service }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ needs.setup.outputs.environment }}
          cache-to: type=gha,mode=max,scope=frontend-${{ needs.setup.outputs.environment }}

      - name: Deploy Frontend Image to Cloud Run
        run: |
          gcloud run deploy ${{ needs.setup.outputs.frontend_service }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ needs.setup.outputs.frontend_service }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="NEXT_PUBLIC_STYLUS_CONTRACT_ADDRESS=${{ env.CONTRACT_ADDRESS }},NEXT_PUBLIC_STYLUS_RPC_URL=https://sepolia-rollup.arbitrum.io/rpc,NEXT_PUBLIC_AI_ORACLE_URL=${{ needs.setup.outputs.oracle_url }}" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --port=3000 \
            --project=${{ env.PROJECT_ID }}

  # ─────────────────────────────────────────────
  # Deployment Summary & Version Tracking
  # ─────────────────────────────────────────────
  summary:
    name: ✅ Deployment Summary
    runs-on: ubuntu-latest
    needs: [setup, deploy-oracle, deploy-frontend]
    if: always()
    steps:
      - name: Print Deployment Summary
        run: |
          echo "## 🚀 Lexius Pay Enterprise Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target / Output |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ needs.setup.outputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **AI Oracle Service** | \`${{ needs.setup.outputs.oracle_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Service** | \`${{ needs.setup.outputs.frontend_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stylus Escrow Address** | \`${{ env.CONTRACT_ADDRESS }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Registry Tag** | \`:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
