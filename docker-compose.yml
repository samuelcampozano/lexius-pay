services:
  ai-oracle:
    build:
      context: ./ai-oracle
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - lexius-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_AI_ORACLE_URL=http://localhost:8080
    depends_on:
      - ai-oracle
    networks:
      - lexius-network

networks:
  lexius-network:
    driver: bridge